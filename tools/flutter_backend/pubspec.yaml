name: flutter_backend
description: Local Dart/Flutter reimplementation of the Omi Python backend behind the same HTTP/WS wire contract.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.2.2
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  sqlite3: ^2.4.0
  uuid: ^4.5.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0