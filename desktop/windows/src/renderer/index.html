<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>omi</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- Sign-in runs in the SYSTEM browser via main (src/main/ipc/auth.ts) —
         the popup-era allowances (frame-src firebaseapp/accounts.google,
         script-src apis.google/gstatic) were removed in the Phase 8 sweep.
         cdn.jsdelivr.net stays: @ricky0123/vad-web fetches its worklet/wasm
         from there. -->
    <!-- LOCAL ADAPT (omi_local_changes pattern): connect-src also allows the
         local harness via ssh tunnels (auth emulator :9199, backend :8100).
         See desktop/windows/.env and OMI_LOCAL_ADAPT.md. Keep this comment
         OUTSIDE the meta content attribute — an HTML comment inside a CSP
         value makes the whole directive invalid. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: https://*.googleusercontent.com;
        font-src 'self' data:;
        media-src 'self' blob: data:;
        connect-src 'self'
          https://identitytoolkit.googleapis.com
          https://securetoken.googleapis.com
          https://www.googleapis.com
          https://*.firebaseapp.com
          https://*.firebaseio.com
          https://firebase.googleapis.com
          https://api.omi.me
          wss://api.omi.me
          https://desktop-backend-hhibjajaja-uc.a.run.app
          http://127.0.0.1:8100
          http://127.0.0.1:9199
          http://localhost:8100
          http://localhost:9199
          https://api.openai.com
          wss://api.openai.com
          https://generativelanguage.googleapis.com
          wss://generativelanguage.googleapis.com
          https://api.deepgram.com
          wss://api.deepgram.com
          https://accounts.google.com
          https://us.i.posthog.com
          https://cdn.jsdelivr.net;
        frame-src 'self';
        worker-src 'self' blob:;
      "
    />
  </head>

  <body style="background: transparent">
    <div id="root" style="background: transparent"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
